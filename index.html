<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan Trip 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><circle cx='50' cy='50' r='30' fill='%23bc002d'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+JP:wght@400;500;700&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <div class="progress-bar" aria-hidden="true"></div>
  <header class="hero">
    <canvas id="g-particles" class="g-canvas" aria-hidden="true"></canvas>
    <div class="hero-inner">
      <div class="hero-actions">
        <div class="lang-bar">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ja">JA</button>
        </div>
        <button type="button" id="plan-toggle" class="plan-toggle-btn">
          <span class="plan-icon">&#9998;</span> <span class="plan-label" data-i18n="plan">Plan Activity</span>
        </button>
      </div>
      <p class="hero-kicker">November - December 2026 &middot; Japan</p>
      <h1>Japan Trip 2026</h1>
      <p class="hero-sub">November 25 - December 13, 2026</p>
      <p class="hero-travelers"></p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div id="overview" class="overview" aria-label="Trip stops"></div>
        <figure class="route-map reveal">
          <img id="real-map" class="map-img" src="images/japan-map.svg?v=2" alt="Map of Japan (placeholder, to be replaced)" />
        </figure>
        <div id="timeline" class="timeline"></div>
      </div>
    </section>

    <section id="calendar-section" class="section calendar-section hidden">
      <div class="container">
        <h2 class="section-title">
          <span class="section-title-text" data-i18n="tripCalendar">Trip Calendar</span>
          <span class="section-title-bg" aria-hidden="true">CAL</span>
        </h2>
        <div class="calendar-legend">
          <span class="legend-item"><span class="legend-dot legend-travel"></span><span data-i18n="legendPlanned">Planned</span></span>
          <span class="legend-item"><span class="legend-dot legend-family"></span><span data-i18n="legendBooked">Booked</span></span>
          <span class="legend-item"><span class="legend-dot legend-busy"></span><span data-i18n="legendBusy">Busy</span></span>
          <span class="legend-item"><span class="legend-dot legend-free"></span><span data-i18n="legendFree">Free</span></span>
        </div>
        <div id="calendar" class="calendar"></div>

        <h3 class="form-title" data-i18n="formTitle">Propose an Activity</h3>
        <p class="form-subtitle" data-i18n="formSubtitle">Pick a free day, suggest something fun. George and Harue will confirm.</p>
        <form id="activity-form" class="activity-form">
          <div class="form-row">
            <label for="plan-day" data-i18n="labelDay">Day</label>
            <select id="plan-day" required>
              <option value="" data-i18n="selectDay">Select a day...</option>
            </select>
          </div>
          <div class="form-row">
            <label for="plan-who" data-i18n="labelWho">Who</label>
            <select id="plan-who" required>
              <option value="" data-i18n="whoPrompt">Who is this for?</option>
              <option value="george" data-i18n="whoGeorge">George</option>
              <option value="harue" data-i18n="whoHarue">Harue</option>
              <option value="both" data-i18n="whoBoth">Both</option>
            </select>
          </div>
          <div class="form-row">
            <label for="plan-activity" data-i18n="labelActivity">Activity</label>
            <input type="text" id="plan-activity" data-i18n-placeholder="activityPlaceholder" placeholder="e.g. Visit the zoo, go hiking, water park..." required />
          </div>
          <button type="submit" class="plan-submit-btn" data-i18n="submit">Propose via Email</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer">George &amp; Harue &middot; Japan Trip 2026</p>
    </div>
  </footer>

  <script src="vendor/splitting.min.js?v=1"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
